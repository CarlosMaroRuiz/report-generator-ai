[project]
name = "report-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "bullmq>=2.0",
  "redis>=5.0",
  "boto3>=1.34",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pydantic-ai-slim[openai]>=1.0",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "moto[s3]", "ruff", "mypy", "watchfiles"]

[tool.setuptools.packages.find]
where = ["src"]