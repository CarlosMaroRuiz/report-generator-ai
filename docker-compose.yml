name: "report-generator-ai"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    logging: *logging
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-reports}
      S3_ACCESS_KEY: ${MINIO_USER:-admin}
      S3_SECRET_KEY: ${MINIO_PASSWORD:?Define MINIO_PASSWORD}
    volumes:
      - ./apps/api:/app
      - ./index.html:/app/public/index.html:ro
      - /app/node_modules
    command: npm run dev
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    logging: *logging
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-reports}
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Define MINIO_PASSWORD}
      GOTENBERG_URL: http://gotenberg:3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Define DEEPSEEK_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-pro}
      CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      AI_TIMEOUT: 300
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/worker/src:/app/src
    command: watchfiles --filter python "python -m worker.main" src
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    init: true
    logging: *logging
    command:
      - gotenberg
      - --chromium-auto-start
      - --api-timeout=90s
      - --chromium-max-queue-size=20
      - --chromium-restart-after=50
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"

  minio:
    image: pgsty/silo:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    logging: *logging
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Define MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mcli ready local || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 15s

  minio-init:
    image: pgsty/silo:latest
    restart: "no"
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Define MINIO_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-reports}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mcli alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mcli mb --ignore-existing "local/$$S3_BUCKET" &&
        mcli anonymous set download "local/$$S3_BUCKET" || true
    depends_on:
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
  redis_data: